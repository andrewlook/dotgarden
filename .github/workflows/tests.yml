name: Tests
on: [push, pull_request]

permissions: {}

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Fetch the examples/starter/ submodule → andrewlook/dotgarden-template
          # (public). Tests that touch the starter then see its real content
          # instead of an empty placeholder.
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - run: uv run --python ${{ matrix.python-version }} --with pytest --with pyyaml python -m pytest tests/ -v

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: true
          persist-credentials: false
      - name: Build test image
        run: docker build -f Dockerfile.test -t dotgarden-test .
      - name: Run integration harness
        run: docker run --rm dotgarden-test
